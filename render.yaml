services:
  # ── Core API (the main AI backend) ────────────────────────────────────────
  - type: web
    name: jarvis-core
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: python -m uvicorn api.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_DEPLOYMENT
        value: llama3-70b-8192
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-english-v3.0
      - key: COHERE_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── Assistant API (chat, voice, confirmation) ─────────────────────────────
  - type: web
    name: jarvis-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: python -m uvicorn backend.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_DEPLOYMENT
        value: llama3-70b-8192
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-english-v3.0
      - key: COHERE_EMBEDDING_DIMENSIONS
        value: "1024"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
